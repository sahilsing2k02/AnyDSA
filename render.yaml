services:
  - type: web
    name: anydsa
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run server
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
    disk:
      name: anydsa-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
