databases:
  - name: anydsa-db
    databaseName: anydsa
    user: anydsa_user
    plan: free

services:
  - type: web
    name: anydsa
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run server
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: anydsa-db
          property: connectionString
