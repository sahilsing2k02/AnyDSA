<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 180" width="100%" height="100%">
  <defs>
    <marker id="bp-arrow" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
      <polygon points="0 0, 6 2.5, 0 5" fill="#38bdf8" />
    </marker>
    <marker id="bp-link" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto">
      <polygon points="0 0, 6 2.5, 0 5" fill="#10b981" />
    </marker>
  </defs>

  <rect width="640" height="180" rx="10" fill="#090d16" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Root Node -->
  <g transform="translate(230, 15)">
    <rect width="180" height="42" rx="6" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="1.6"/>
    <text x="90" y="26" fill="#e0e7ff" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Root: [ 20 | 40 ]</text>
  </g>

  <!-- Connectors from Root to Leaves -->
  <path d="M 270 57 L 130 95" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#bp-arrow)"/>
  <path d="M 320 57 L 320 95" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#bp-arrow)"/>
  <path d="M 370 57 L 510 95" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#bp-arrow)"/>

  <!-- Leaf 1 -->
  <g transform="translate(30, 100)">
    <rect width="170" height="50" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="85" y="22" fill="#93c5fd" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Leaf 1: [ 5 | 10 | 15 ]</text>
    <text x="85" y="38" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle">keys &amp; row pointers</text>
  </g>

  <!-- Leaf link 1 -> 2 -->
  <path d="M 205 125 L 225 125" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#bp-link)"/>

  <!-- Leaf 2 -->
  <g transform="translate(235, 100)">
    <rect width="170" height="50" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="85" y="22" fill="#93c5fd" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Leaf 2: [ 20 | 25 | 35 ]</text>
    <text x="85" y="38" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle">doubly linked leaves</text>
  </g>

  <!-- Leaf link 2 -> 3 -->
  <path d="M 410 125 L 430 125" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#bp-link)"/>

  <!-- Leaf 3 -->
  <g transform="translate(440, 100)">
    <rect width="170" height="50" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="85" y="22" fill="#93c5fd" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Leaf 3: [ 40 | 45 | 50 ]</text>
    <text x="85" y="38" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle">O(log N) + Range scan</text>
  </g>
</svg>