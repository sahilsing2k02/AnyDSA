<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 150" width="100%" height="100%">
  <defs>
    <marker id="s-arrow" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#38bdf8" />
    </marker>
  </defs>

  <rect width="640" height="150" rx="10" fill="#090d16" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Serial -->
  <g transform="translate(25, 30)">
    <rect width="160" height="90" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1.6"/>
    <text x="80" y="36" fill="#93c5fd" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Serial Schedule</text>
    <rect x="20" y="48" width="120" height="26" rx="4" fill="#1e293b" stroke="#334155"/>
    <text x="80" y="65" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle">T1 then T2 (Sequential)</text>
  </g>

  <!-- Serializable -->
  <g transform="translate(230, 30)">
    <rect width="180" height="90" rx="8" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="1.6"/>
    <text x="90" y="36" fill="#c4b5fd" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Serializable Schedule</text>
    <rect x="20" y="48" width="140" height="26" rx="4" fill="#2e1065" stroke="#7c3aed"/>
    <text x="90" y="65" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle">T1 &amp; T2 Interleaved</text>
  </g>

  <!-- Arrow -->
  <path d="M 420 75 L 455 75" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#s-arrow)"/>

  <!-- Same Outcome -->
  <g transform="translate(465, 30)">
    <rect width="150" height="90" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.6"/>
    <text x="75" y="36" fill="#6ee7b7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Identical Result</text>
    <rect x="15" y="48" width="120" height="26" rx="4" fill="#022c22" stroke="#059669"/>
    <text x="75" y="65" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle">Same effect as serial</text>
  </g>
</svg>