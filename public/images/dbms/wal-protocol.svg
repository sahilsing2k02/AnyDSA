<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 150" width="100%" height="100%">
  <defs>
    <marker id="w-arrow" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#38bdf8" />
    </marker>
  </defs>

  <rect width="640" height="150" rx="10" fill="#090d16" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Transaction Step -->
  <g transform="translate(25, 30)">
    <rect width="165" height="90" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1.6"/>
    <text x="82" y="36" fill="#93c5fd" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Transaction</text>
    <rect x="20" y="48" width="125" height="26" rx="4" fill="#1e293b" stroke="#334155"/>
    <text x="82" y="65" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle">UPDATE Balance</text>
  </g>

  <!-- Arrow write log -->
  <path d="M 195 75 L 230 75" fill="none" stroke="#38bdf8" stroke-width="1.6" marker-end="url(#w-arrow)"/>
  <text x="212" y="65" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle">1. log</text>

  <!-- WAL Log Box -->
  <g transform="translate(235, 25)">
    <rect width="170" height="100" rx="8" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="1.8"/>
    <text x="85" y="32" fill="#c4b5fd" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Durable WAL</text>
    <rect x="15" y="44" width="140" height="24" rx="4" fill="#2e1065" stroke="#7c3aed"/>
    <text x="85" y="60" fill="#e0e7ff" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Append Log to Disk</text>
    <text x="85" y="85" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle">✓ Commit Acknowledged</text>
  </g>

  <!-- Arrow flush page -->
  <path d="M 410 75 L 445 75" fill="none" stroke="#10b981" stroke-width="1.6" marker-end="url(#w-arrow)"/>
  <text x="427" y="65" fill="#10b981" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle">2. async</text>

  <!-- Data Page Flush Box -->
  <g transform="translate(450, 30)">
    <rect width="165" height="90" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.6"/>
    <text x="82" y="36" fill="#6ee7b7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Table Data Page</text>
    <rect x="20" y="48" width="125" height="26" rx="4" fill="#022c22" stroke="#059669"/>
    <text x="82" y="65" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle">Flushed later to disk</text>
  </g>
</svg>