<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 160" width="100%" height="100%">
  <defs>
    <marker id="dbms-d-arrow" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#f87171" />
    </marker>
  </defs>

  <rect width="620" height="160" rx="10" fill="#090d16" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Transaction 1 -->
  <g transform="translate(30, 30)">
    <rect width="180" height="100" rx="8" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.6"/>
    <text x="90" y="38" fill="#e0e7ff" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Transaction T1</text>
    <rect x="25" y="50" width="130" height="26" rx="4" fill="#064e3b" stroke="#34d399"/>
    <text x="90" y="67" fill="#a7f3d0" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle">Holds Lock on Row A</text>
  </g>

  <!-- Cycle Arrows -->
  <path d="M 220 60 L 395 60" fill="none" stroke="#f87171" stroke-width="2" marker-end="url(#dbms-d-arrow)"/>
  <text x="310" y="50" fill="#f87171" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">T1 waits for T2 (Row B)</text>

  <path d="M 405 105 L 230 105" fill="none" stroke="#f87171" stroke-width="2" marker-end="url(#dbms-d-arrow)"/>
  <text x="310" y="125" fill="#f87171" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">T2 waits for T1 (Row A)</text>

  <!-- Transaction 2 -->
  <g transform="translate(410, 30)">
    <rect width="180" height="100" rx="8" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.6"/>
    <text x="90" y="38" fill="#e0e7ff" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Transaction T2</text>
    <rect x="25" y="50" width="130" height="26" rx="4" fill="#064e3b" stroke="#34d399"/>
    <text x="90" y="67" fill="#a7f3d0" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle">Holds Lock on Row B</text>
  </g>
</svg>