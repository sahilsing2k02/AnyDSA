<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 220" width="100%" height="100%">
  <defs>
    <marker id="m1" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#38bdf8" />
    </marker>
    <marker id="m2" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#facc15" />
    </marker>
    <marker id="m3" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#ef4444" />
    </marker>
  </defs>

  <rect width="660" height="220" rx="12" fill="#090d16" stroke="#1e293b" stroke-width="1.5"/>

  <!-- NEW -->
  <g transform="translate(25, 45)">
    <rect width="85" height="42" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
    <text x="42" y="26" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">New</text>
  </g>

  <!-- Arrow: admit -->
  <path d="M 110 66 L 165 66" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#m1)"/>
  <text x="137" y="58" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle">admit</text>

  <!-- READY -->
  <g transform="translate(175, 45)">
    <rect width="95" height="42" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.8"/>
    <text x="47" y="26" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Ready</text>
  </g>

  <!-- Arrow: dispatch (top) -->
  <path d="M 270 56 L 350 56" fill="none" stroke="#38bdf8" stroke-width="1.6" marker-end="url(#m1)"/>
  <text x="310" y="48" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle">dispatch</text>

  <!-- Arrow: preempt (bottom) -->
  <path d="M 350 76 L 275 76" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#m1)"/>
  <text x="310" y="90" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle">preempt</text>

  <!-- RUNNING -->
  <g transform="translate(360, 45)">
    <rect width="95" height="42" rx="8" fill="#064e3b" stroke="#34d399" stroke-width="1.8"/>
    <text x="47" y="26" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Running</text>
  </g>

  <!-- Arrow: exit -->
  <path d="M 455 66 L 530 66" fill="none" stroke="#ef4444" stroke-width="1.6" marker-end="url(#m3)"/>
  <text x="492" y="58" fill="#f87171" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle">exit</text>

  <!-- TERMINATED -->
  <g transform="translate(540, 45)">
    <rect width="95" height="42" rx="8" fill="#3f1212" stroke="#ef4444" stroke-width="1.8"/>
    <text x="47" y="26" fill="#fca5a5" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Terminated</text>
  </g>

  <!-- WAITING / BLOCKED (Bottom) -->
  <g transform="translate(265, 145)">
    <rect width="110" height="44" rx="8" fill="#451a03" stroke="#f59e0b" stroke-width="1.8"/>
    <text x="55" y="27" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Waiting / I/O</text>
  </g>

  <!-- Running to Waiting -->
  <path d="M 410 87 L 410 167 L 380 167" fill="none" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#m2)"/>
  <text x="445" y="135" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="10">event wait</text>

  <!-- Waiting to Ready -->
  <path d="M 265 167 L 220 167 L 220 92" fill="none" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#m1)"/>
  <text x="180" y="135" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="10">event done</text>
</svg>
