<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 200" width="100%" height="100%">
  <defs>
    <marker id="cow-arrow" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#38bdf8" />
    </marker>
    <marker id="cow-arrow-green" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#34d399" />
    </marker>
  </defs>

  <rect width="620" height="200" rx="12" fill="#090d16" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Parent Process Box -->
  <g transform="translate(30, 45)">
    <rect width="140" height="110" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1.6"/>
    <text x="70" y="45" fill="#93c5fd" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Parent Process</text>
    <rect x="15" y="65" width="110" height="24" rx="4" fill="#1e293b" stroke="#334155"/>
    <text x="70" y="81" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle">Page Table (R/O)</text>
  </g>

  <!-- Arrow Parent to Shared -->
  <path d="M 175 100 L 230 100" fill="none" stroke="#38bdf8" stroke-width="1.6" marker-end="url(#cow-arrow)"/>
  <text x="202" y="90" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle">maps to</text>

  <!-- Shared Physical Frame -->
  <g transform="translate(240, 35)">
    <rect width="140" height="130" rx="8" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="1.8"/>
    <text x="70" y="38" fill="#c4b5fd" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Shared Physical</text>
    <text x="70" y="55" fill="#a78bfa" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle">Page Frame</text>
    <rect x="15" y="75" width="110" height="40" rx="4" fill="#2e1065" stroke="#7c3aed"/>
    <text x="70" y="92" fill="#e0e7ff" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Read-Only initially</text>
    <text x="70" y="106" fill="#f43f5e" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle">Write ➔ Trap &amp; Copy</text>
  </g>

  <!-- Arrow Child to Shared -->
  <path d="M 445 100 L 390 100" fill="none" stroke="#34d399" stroke-width="1.6" marker-end="url(#cow-arrow-green)"/>
  <text x="417" y="90" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle">maps to</text>

  <!-- Child Process Box -->
  <g transform="translate(450, 45)">
    <rect width="140" height="110" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.6"/>
    <text x="70" y="45" fill="#6ee7b7" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Child Process</text>
    <rect x="15" y="65" width="110" height="24" rx="4" fill="#022c22" stroke="#059669"/>
    <text x="70" y="81" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle">fork() clone (R/O)</text>
  </g>
</svg>