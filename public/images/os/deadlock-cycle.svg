<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 200" width="100%" height="100%">
  <defs>
    <marker id="d-arrow-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#f87171" />
    </marker>
    <marker id="d-arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#38bdf8" />
    </marker>
  </defs>

  <rect width="620" height="200" rx="12" fill="#090d16" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Thread 1 -->
  <g transform="translate(35, 45)">
    <rect width="180" height="110" rx="10" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.8"/>
    <text x="90" y="45" fill="#e0e7ff" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Thread 1</text>
    <rect x="25" y="60" width="130" height="28" rx="6" fill="#064e3b" stroke="#34d399" stroke-width="1.2"/>
    <text x="90" y="78" fill="#a7f3d0" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Holds Resource A</text>
  </g>

  <!-- Circular Wait Arrows -->
  <g>
    <!-- T1 waits for B (Top Arrow) -->
    <path d="M 220 75 L 395 75" fill="none" stroke="#f87171" stroke-width="2" marker-end="url(#d-arrow-red)"/>
    <text x="310" y="65" fill="#f87171" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">T1 waits for Resource B</text>

    <!-- T2 waits for A (Bottom Arrow) -->
    <path d="M 405 125 L 230 125" fill="none" stroke="#f87171" stroke-width="2" marker-end="url(#d-arrow-red)"/>
    <text x="310" y="145" fill="#f87171" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">T2 waits for Resource A</text>
  </g>

  <!-- Thread 2 -->
  <g transform="translate(405, 45)">
    <rect width="180" height="110" rx="10" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.8"/>
    <text x="90" y="45" fill="#e0e7ff" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Thread 2</text>
    <rect x="25" y="60" width="130" height="28" rx="6" fill="#064e3b" stroke="#34d399" stroke-width="1.2"/>
    <text x="90" y="78" fill="#a7f3d0" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Holds Resource B</text>
  </g>
</svg>
