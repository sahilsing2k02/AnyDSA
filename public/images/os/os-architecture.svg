<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 160" width="100%" height="100%">
  <defs>
    <marker id="oa-arrow" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#38bdf8" />
    </marker>
    <marker id="oa-arrow-teal" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#34d399" />
    </marker>
  </defs>

  <rect width="620" height="160" rx="12" fill="#090d16" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Applications -->
  <g transform="translate(30, 45)">
    <rect width="140" height="70" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.6"/>
    <text x="70" y="38" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Applications</text>
    <text x="70" y="55" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle">Browser, Shell, IDE</text>
  </g>

  <!-- Arrow services -->
  <path d="M 175 80 L 235 80" fill="none" stroke="#38bdf8" stroke-width="1.6" marker-end="url(#oa-arrow)"/>
  <text x="205" y="70" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle">services</text>

  <!-- Operating System -->
  <g transform="translate(245, 35)">
    <rect width="150" height="90" rx="10" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="1.8"/>
    <text x="75" y="42" fill="#e0e7ff" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Operating System</text>
    <text x="75" y="60" fill="#a78bfa" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle">(Kernel &amp; Subsystems)</text>
    <text x="75" y="75" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle">CPU, Mem, I/O, FS</text>
  </g>

  <!-- Arrow control -->
  <path d="M 400 80 L 440 80" fill="none" stroke="#34d399" stroke-width="1.6" marker-end="url(#oa-arrow-teal)"/>
  <text x="420" y="70" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle">control</text>

  <!-- Hardware -->
  <g transform="translate(450, 45)">
    <rect width="140" height="70" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.6"/>
    <text x="70" y="38" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Hardware</text>
    <text x="70" y="55" fill="#6ee7b7" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle">CPU, RAM, Disks, NIC</text>
  </g>
</svg>
