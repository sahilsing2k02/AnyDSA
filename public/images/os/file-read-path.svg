<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 160" width="100%" height="100%">
  <defs>
    <marker id="fr-arrow" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#38bdf8" />
    </marker>
  </defs>

  <rect width="660" height="160" rx="12" fill="#090d16" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Step 1: Application -->
  <g transform="translate(25, 45)">
    <rect width="115" height="70" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1.6"/>
    <text x="57" y="38" fill="#93c5fd" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Application</text>
    <text x="57" y="55" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle">User Buffer</text>
  </g>

  <!-- Arrow: open/read -->
  <path d="M 145 80 L 180 80" fill="none" stroke="#38bdf8" stroke-width="1.6" marker-end="url(#fr-arrow)"/>
  <text x="162" y="70" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle">open/read</text>

  <!-- Step 2: System Call -->
  <g transform="translate(190, 45)">
    <rect width="115" height="70" rx="8" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="1.6"/>
    <text x="57" y="38" fill="#c4b5fd" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">System Call</text>
    <text x="57" y="55" fill="#a78bfa" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle">Kernel Trap</text>
  </g>

  <!-- Arrow: kernel -->
  <path d="M 310 80 L 345 80" fill="none" stroke="#38bdf8" stroke-width="1.6" marker-end="url(#fr-arrow)"/>
  <text x="327" y="70" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle">kernel</text>

  <!-- Step 3: VFS / Filesystem -->
  <g transform="translate(355, 45)">
    <rect width="115" height="70" rx="8" fill="#1e293b" stroke="#0ea5e9" stroke-width="1.6"/>
    <text x="57" y="38" fill="#7dd3fc" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">VFS / FS</text>
    <text x="57" y="55" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle">Inode &amp; Perms</text>
  </g>

  <!-- Arrow: data -->
  <path d="M 475 80 L 510 80" fill="none" stroke="#10b981" stroke-width="1.6" marker-end="url(#fr-arrow)"/>
  <text x="492" y="70" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle">data</text>

  <!-- Step 4: Page Cache / Disk -->
  <g transform="translate(520, 45)">
    <rect width="115" height="70" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.6"/>
    <text x="57" y="38" fill="#6ee7b7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Page Cache</text>
    <text x="57" y="55" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle">or Storage Disk</text>
  </g>
</svg>