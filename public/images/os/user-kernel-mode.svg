<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 200" width="100%" height="100%">
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#38bdf8" />
    </marker>
    <marker id="arrowhead-return" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#a78bfa" />
    </marker>
    <linearGradient id="userGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="kernelGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#2e1065"/>
    </linearGradient>
  </defs>

  <rect width="620" height="200" rx="12" fill="#090d16" stroke="#1e293b" stroke-width="1.5"/>

  <!-- User Mode Box -->
  <g transform="translate(30, 40)">
    <rect width="180" height="120" rx="10" fill="url(#userGrad)" stroke="#38bdf8" stroke-width="1.8"/>
    <text x="90" y="50" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" text-anchor="middle">User Mode</text>
    <rect x="35" y="72" width="110" height="26" rx="6" fill="rgba(56, 189, 248, 0.12)" stroke="#38bdf8" stroke-opacity="0.3"/>
    <text x="90" y="89" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Restricted Ring 3</text>
  </g>

  <!-- Transition Arrows -->
  <g>
    <!-- System call / trap -->
    <path d="M 215 75 L 400 75" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="310" y="65" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">system call / trap</text>

    <!-- Return to user space -->
    <path d="M 405 125 L 220 125" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrowhead-return)"/>
    <text x="310" y="145" fill="#a78bfa" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">return / iret</text>
  </g>

  <!-- Kernel Mode Box -->
  <g transform="translate(410, 40)">
    <rect width="180" height="120" rx="10" fill="url(#kernelGrad)" stroke="#c084fc" stroke-width="1.8"/>
    <text x="90" y="50" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Kernel Mode</text>
    <rect x="35" y="72" width="110" height="26" rx="6" fill="rgba(192, 132, 252, 0.12)" stroke="#c084fc" stroke-opacity="0.3"/>
    <text x="90" y="89" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Privileged Ring 0</text>
  </g>
</svg>